<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#0369A1" />
    </linearGradient>
    <linearGradient id="mane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <!-- Mane -->
  <circle cx="96" cy="100" r="56" fill="url(#mane)" />
  <!-- Ears -->
  <circle cx="62" cy="66" r="16" fill="#F59E0B" />
  <circle cx="62" cy="66" r="9" fill="#FDE68A" />
  <circle cx="130" cy="66" r="16" fill="#F59E0B" />
  <circle cx="130" cy="66" r="9" fill="#FDE68A" />
  <!-- Face -->
  <circle cx="96" cy="102" r="42" fill="url(#face)" />
  <!-- Eyes -->
  <circle cx="82" cy="95" r="5" fill="#18181B" />
  <circle cx="84" cy="93" r="1.5" fill="#FFFFFF" />
  <circle cx="110" cy="95" r="5" fill="#18181B" />
  <circle cx="112" cy="93" r="1.5" fill="#FFFFFF" />
  <!-- Nose & Mouth -->
  <polygon points="96,105 91,100 101,100" fill="#78350F" />
  <path d="M 91 106 Q 96 112 101 106" stroke="#78350F" strokeWidth="2" fill="none" strokeLinecap="round" />
  <!-- Cheeks -->
  <circle cx="73" cy="103" r="5" fill="#FCA5A5" opacity="0.6" />
  <circle cx="119" cy="103" r="5" fill="#FCA5A5" opacity="0.6" />
  <!-- Fire Flame Badge in corner -->
  <g transform="translate(130, 20) scale(0.9)">
    <circle cx="20" cy="20" r="18" fill="#EF4444" />
    <text x="9" y="27" font-size="22">🔥</text>
  </g>
</svg>
